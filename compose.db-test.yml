name: studio-parallel-db-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studio_parallel_test
      POSTGRES_PASSWORD: studio_parallel_test
      POSTGRES_USER: studio_parallel_test
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U studio_parallel_test -d studio_parallel_test
      interval: 1s
      timeout: 5s
      retries: 20
    ports:
      - "55432:5432"
    # Deliberately not tmpfs. A memory-backed data directory commits fast enough
    # to hide concurrency defects that a disk-backed database exposes: the
    # concurrent-enqueue deduplication race passed 12/12 locally on tmpfs while
    # failing 4/5 on disk and failing every hosted run. Hosted CI uses a
    # disk-backed service container, so the local database matches it. The
    # container is still removed after every run, so nothing persists.
