name: Database schema

on:
  pull_request:
    paths:
      - ".github/workflows/database-schema.yml"
      - "package-lock.json"
      - "package.json"
      - "packages/config/**"
      - "packages/db/**"
      - "tsconfig.base.json"
      - "vitest.config.ts"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studio_parallel_test
          POSTGRES_PASSWORD: studio_parallel_test
          POSTGRES_USER: studio_parallel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_parallel_test -d studio_parallel_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://studio_parallel_test:studio_parallel_test@127.0.0.1:5432/studio_parallel_test
      PROVIDER_MODE: fake
      PUBLIC_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .node-version
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run db:drift:check
      - run: npm run test:db:integration:existing
