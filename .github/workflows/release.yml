name: Release artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      reference:
        description: Commit-ish to build. Defaults to the triggering ref.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.target }} image with SBOM and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # No deployment or provider secret is used. Publishing and signing rely on
      # the scoped job token and the workflow OIDC identity only.
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - web
          - worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.reference || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install from lockfile
        run: npm ci
      - name: Generate production SBOM
        run: npm run security:sbom
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Sign in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Build and publish by immutable digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}
          target: ${{ matrix.target }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          push-to-registry: true
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.target }}
      - name: Attest the software bill of materials
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          push-to-registry: true
          sbom-path: artifacts/sbom/cyclonedx.json
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.target }}
      - name: Upload the release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: sbom-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/sbom/cyclonedx.json
          retention-days: 90
