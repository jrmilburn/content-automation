name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PROVIDER_MODE: fake
  PUBLIC_ORIGIN: http://127.0.0.1:3000

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install from lockfile
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run unit and component tests
        run: npm run test:ci
      - name: Build production applications
        run: npm run build
      - name: Upload concise unit results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: unit-results-${{ github.run_id }}
          path: artifacts/unit/results.xml
          retention-days: 7

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studio_parallel_test
          POSTGRES_PASSWORD: studio_parallel_test
          POSTGRES_USER: studio_parallel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_parallel_test -d studio_parallel_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://studio_parallel_test:studio_parallel_test@127.0.0.1:5432/studio_parallel_test
      # Prisma commands prefer DIRECT_URL; it is pinned to the same service
      # container so no ambient value can redirect a migration.
      DIRECT_URL: postgresql://studio_parallel_test:studio_parallel_test@127.0.0.1:5432/studio_parallel_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install from lockfile
        run: npm ci
      # Mirrors packages/db/scripts/run-integration-tests.mjs, which is the local
      # equivalent. The queue migration also builds the workspace packages that
      # the integration suites import.
      - name: Validate and generate database client
        run: npm run db:validate && npm run db:generate
      - name: Apply migrations and deterministic seed
        run: npm run db:migrate:deploy && npm run db:seed
      - name: Apply the queue schema and build workspace packages
        run: npm run queue:migrate
      - name: Check schema drift
        run: npm run db:drift:check
      - name: Run real PostgreSQL integration tests
        run: npm run test:db:integration:existing

  storage:
    name: Object storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install from lockfile
        run: npm ci
      - name: Build workspace packages
        run: npm run build:packages
      # This job runs the same compose-based runner as a developer does, rather
      # than a service container, because MinIO needs a `server /data` command
      # and a GitHub service container cannot supply one. Keeping the harness
      # identical also means a local pass and a hosted pass mean the same thing.
      #
      # Only this job exercises the real signing, multipart, abort and
      # server-side-encryption paths; the unit suite uses an in-memory fake that
      # cannot disagree with the adapter.
      - name: Run real object storage integration tests
        run: npm run test:storage:integration

  media:
    name: Media validation integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      PROVIDER_MODE: fake
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install from lockfile
        run: npm ci
      # ffmpeg builds the fixtures and ffprobe reads them back. The runner image
      # is not contractually required to carry either, so this installs them
      # explicitly rather than depending on what happens to be preinstalled.
      - name: Install the media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffprobe -version | head -n 1
      - name: Build workspace packages
        run: npm run build:packages
      # Only this job runs the real parser. The unit suite feeds the policy
      # hand-written probe output, which proves the rules but not the reading:
      # it cannot catch the deployed ffprobe describing a real file differently
      # from how a fixture author imagined it would.
      - name: Run real media validation integration tests
        run: npm run test:media:integration

  browser:
    name: Browser and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install from lockfile
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npm run test:e2e:install:ci
      - name: Run built-app smoke tests
        run: npm run test:e2e
      - name: Upload concise browser results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: browser-results-${{ github.run_id }}
          path: artifacts/playwright/results.xml
          retention-days: 7
